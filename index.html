<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connections</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121213;
      color: #d7dadc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    
    h1 { margin-bottom: 20px; font-weight: 600; letter-spacing: 0.1em; }
    
    .solved-groups { width: 100%; max-width: 600px; margin-bottom: 10px; }
    
    .solved-group {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      text-align: center;
    }
    .solved-group .category { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .solved-group .words { font-size: 16px; text-transform: uppercase; }
    
    .group-yellow { background: #957f1b; color: #d7dadc; }
    .group-green { background: #336d2e; color: #d7dadc; }
    .group-blue { background: #1a5b9d; color: #d7dadc; }
    .group-purple { background: #6b3b90; color: #d7dadc; }

    .pending-groups { width: 100%; max-width: 600px; }

    .pending-group {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 40px 16px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #565758;
    }
    .pending-group .words {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .pending-group .pending-submit {
      padding: 6px 14px;
      border-color: #d7dadc;
      font-size: 12px;
    }
    .pending-group .pending-submit:hover { background: #6a6b6c; }
    .pending-group .pending-cancel {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      line-height: 1;
    }
    .pending-group .pending-cancel:hover { background: #6a6b6c; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
    }
    
    .tile {
      aspect-ratio: 2.5 / 1;
      background: #3a3a3c;
      border: none;
      border-radius: 8px;
      color: #d7dadc;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
    }
    
    .tile:hover { background: #4a4a4c; }
    .tile.selected { background: #5a5a5c; transform: scale(0.95); }
    
    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    
    button {
      padding: 12px 24px;
      border: 1px solid #3a3a3c;
      border-radius: 24px;
      background: transparent;
      color: #d7dadc;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #3a3a3c; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .message {
      min-height: 24px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .message.error { color: #e74c3c; }
    .message.success { color: #538d4e; }
    
    .mistakes {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 14px;
    }
    .mistake-dot {
      width: 12px;
      height: 12px;
      background: #3a3a3c;
      border-radius: 50%;
    }
    .mistake-dot.used { background: #555; }

    @media (max-width: 640px) {
      body { padding: 10px; }
      h1 { font-size: 20px; margin-bottom: 15px; }
      .grid { gap: 6px; }
      .tile {
        font-size: 11px;
        padding: 4px;
        border-radius: 6px;
      }
      .controls { gap: 8px; }
      button {
        padding: 10px 16px;
        font-size: 12px;
      }
      .solved-group { padding: 12px; }
      .solved-group .category { font-size: 12px; }
      .solved-group .words { font-size: 14px; }
      .pending-group { padding: 12px 36px 12px 8px; gap: 8px; }
      .pending-group .words { font-size: 14px; }
      .pending-group .pending-submit { padding: 6px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <h1>CONNECTIONS</h1>
  <div class="solved-groups" id="solved"></div>
  <div class="pending-groups" id="pending"></div>
  <div class="grid" id="grid"></div>
  <div class="message" id="message"></div>
  <div class="controls">
    <button id="shuffle">Shuffle</button>
    <button id="deselect">Deselect All</button>
    <button id="group" disabled>Group</button>
    <button id="submit" disabled>Submit</button>
  </div>
  <div class="mistakes">
    Mistakes remaining:
    <span id="mistakes"></span>
  </div>

  <script>
    const colors = ["yellow", "green", "blue", "purple"];
    
    let tiles = [];
    let selected = new Set();
    let solved = [];
    let mistakes = 4;
    let groups = [];
    let pending = [];
    let gameOver = false;

    const grid = document.getElementById('grid');
    const solvedDiv = document.getElementById('solved');
    const pendingDiv = document.getElementById('pending');
    const groupBtn = document.getElementById('group');
    const messageDiv = document.getElementById('message');
    const mistakesDiv = document.getElementById('mistakes');
    const submitBtn = document.getElementById('submit');

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function fetchWithProxy(url) {
      const proxies = [
        u => `https://r.jina.ai/${u}`,
        u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
        u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
        u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
      ];
      for (const makeUrl of proxies) {
        try {
          const res = await fetch(makeUrl(url));
          if (!res.ok) continue;
          const text = await res.text();
          try {
            const wrapper = JSON.parse(text);
            // allorigins wraps in {contents: "..."}
            if (wrapper.contents) return JSON.parse(wrapper.contents);
            return wrapper;
          } catch {
            // r.jina.ai wraps the body in a markdown preamble
            return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
          }
        } catch { continue; }
      }
      throw new Error('All CORS proxies failed');
    }

    async function loadPuzzle() {
      const today = new Date().toLocaleDateString('en-CA');
      try {
        const data = await fetchWithProxy(`https://www.nytimes.com/svc/connections/v2/${today}.json`);
        
        // Assign random colors
        const shuffledColors = [...colors];
        
        groups = data.categories.map((cat, i) => ({
          category: cat.title,
          words: cat.cards.map(c => c.content),
          color: shuffledColors[i]
        }));
        
        tiles = groups.flatMap(g => g.words.map(w => ({ word: w, group: g })));
        shuffle(tiles);
        render();
      } catch (err) {
        messageDiv.textContent = 'Failed to load puzzle. Check console for details.';
        messageDiv.className = 'message error';
        console.error('Failed to load puzzle:', err);
      }
    }

    function render() {
      grid.innerHTML = '';
      tiles.forEach(tile => {
        const btn = document.createElement('button');
        btn.className = 'tile' + (selected.has(tile.word) ? ' selected' : '');
        btn.textContent = tile.word;
        btn.onclick = () => toggleSelect(tile.word);
        grid.appendChild(btn);
      });

      pendingDiv.innerHTML = '';
      pending.forEach((groupTiles, i) => {
        const div = document.createElement('div');
        div.className = 'pending-group';

        const submit = document.createElement('button');
        submit.className = 'pending-submit';
        submit.textContent = 'Submit';
        submit.onclick = () => submitPending(i);

        const words = document.createElement('div');
        words.className = 'words';
        words.textContent = groupTiles.map(t => t.word).join(', ');

        const cancel = document.createElement('button');
        cancel.className = 'pending-cancel';
        cancel.textContent = '×';
        cancel.title = 'Ungroup';
        cancel.onclick = () => ungroup(i);

        div.append(submit, words, cancel);
        pendingDiv.appendChild(div);
      });

      mistakesDiv.innerHTML = Array(4).fill(0)
        .map((_, i) => `<span class="mistake-dot${i >= mistakes ? ' used' : ''}"></span>`)
        .join('');

      submitBtn.disabled = gameOver || selected.size !== 4;
      groupBtn.disabled = gameOver || selected.size !== 4;
      if (gameOver) document.querySelectorAll('button').forEach(b => b.disabled = true);
    }

    function toggleSelect(word) {
      if (selected.has(word)) {
        selected.delete(word);
      } else if (selected.size < 4) {
        selected.add(word);
      }
      render();
    }

    function showMessage(text, type = '') {
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
      if (text) setTimeout(() => { messageDiv.textContent = ''; messageDiv.className = 'message'; }, 2000);
    }

    document.getElementById('shuffle').onclick = () => {
      // Partition into selected and unselected
      const selectedTiles = tiles.filter(t => selected.has(t.word));
      const unselectedTiles = tiles.filter(t => !selected.has(t.word));
      
      // Shuffle each partition
      shuffle(selectedTiles);
      shuffle(unselectedTiles);
      
      // Selected first, then unselected
      tiles = [...selectedTiles, ...unselectedTiles];
      render();
    };

    document.getElementById('deselect').onclick = () => {
      selected.clear();
      render();
    };

    groupBtn.onclick = () => {
      pending.push(tiles.filter(t => selected.has(t.word)));
      tiles = tiles.filter(t => !selected.has(t.word));
      selected.clear();
      render();
    };

    function ungroup(i) {
      tiles.push(...pending[i]);
      pending.splice(i, 1);
      render();
    }

    function submitPending(i) {
      const groupTiles = pending[i];
      pending.splice(i, 1);
      if (!checkGuess(groupTiles) && !gameOver) tiles.push(...groupTiles);
      render();
    }

    submitBtn.onclick = () => {
      const selectedTiles = tiles.filter(t => selected.has(t.word));
      if (checkGuess(selectedTiles)) {
        tiles = tiles.filter(t => !selected.has(t.word));
        selected.clear();
      }
      render();
    };

    function checkGuess(guessTiles) {
      const groupCounts = new Map();
      guessTiles.forEach(t => {
        groupCounts.set(t.group, (groupCounts.get(t.group) || 0) + 1);
      });

      if (groupCounts.size === 1) {
        const group = guessTiles[0].group;
        solved.push(group);

        const div = document.createElement('div');
        div.className = `solved-group group-${group.color}`;
        div.innerHTML = `<div class="category">${group.category}</div><div class="words">${group.words.join(', ')}</div>`;
        solvedDiv.appendChild(div);

        if (solved.length === groups.length) {
          showMessage('Congratulations!', 'success');
        }
        return true;
      } else {
        // Check for "one away"
        const maxMatch = Math.max(...groupCounts.values());
        if (maxMatch === 3) {
          showMessage('One away...', 'error');
        } else {
          showMessage('Incorrect', 'error');
        }
        mistakes--;
        if (mistakes === 0) {
          showMessage('Game over!', 'error');
          gameOver = true;
          const remaining = groups.filter(g => !solved.includes(g));
          remaining.forEach(group => {
            const div = document.createElement('div');
            div.className = `solved-group group-${group.color}`;
            div.innerHTML = `<div class="category">${group.category}</div><div class="words">${group.words.join(', ')}</div>`;
            solvedDiv.appendChild(div);
          });
          tiles = [];
          pending = [];
          selected.clear();
        }
        return false;
      }
    }

    // Load today's puzzle
    loadPuzzle();
  </script>
</body>
</html>
